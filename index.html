<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Player UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="music.css">
</head>
<body>

    <div class="player">
        <div class="album">
            <img src="album.png" alt="Album Cover">
        </div>

        <div class="song-title">Die with a smile</div>
        <div class="artist">Lady Gaga,Bruno Mars</div>

        <div class="progress-container">
            <div class="progress"></div>
        </div>

        <div class="controls">
            <button>&#9664;&#9664;</button>
            <button>&#9654;</button>
            <button>&#9654;&#9654;</button>
        </div>
    </div>

</body>
</html>
